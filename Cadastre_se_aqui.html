    <title>Cadastre se aqui</title>
    <link rel="stylesheet" href="login.css">

<body>

        <div class="login-container">

                <label for="email">CPF</label>
                <input type="number" placeholder="000.000.000-00" name="email" required>

            </form>
        </div>
    </div>
