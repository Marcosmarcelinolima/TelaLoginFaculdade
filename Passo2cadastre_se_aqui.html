<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre se aqui</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="container">
        <div class="lado_esquerdo">
            <p>Educação não é um aprendizado de fatos, mas sim um processo de transformação da mente. <span>Albert
                    Einstein</span></p>
        </div>


        <div class="login-container">
            <form class="login-form" action="/login" method="post">
                <h1>Cadastre-se</h1>
                <p>Passo 2 de 2 <br>Por favor, insira suas informações para concluir o cadastro</p>
                <br>
                <label for="name">Nome:</label>
                    <input type="text" placeholder="Seu nome completo" name="name" required>
                <label for="phone">Telefone:</label>
                    <input type="number" placeholder="(00) 00000-0000" name="phone" required>
                <label for="email">E-mail:</label>
                    <input type="email" placeholder="Digite seu e-mail" name="email" required>
                <label for="password">Senha:</label>
                    <input type="password" placeholder="Digite sua senha" name="password" required>
                <button onclick="window.location.href='/Fim_cadastro.html'" type="submit">FINALIZAR CADASTRO</button>
            </form>
        </div>
    </div>

</body>

</html>
